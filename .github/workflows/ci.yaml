name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  buf:
    name: Lint, format, and breaking checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=main
          push: false
          archive: false

  generate:
    name: Verify generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Regenerate code
        run: buf generate
      - name: Fail if gen/ is stale
        run: git diff --exit-code gen/
