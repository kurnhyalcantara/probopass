syntax = "proto3";

package probopass.auth.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "probopass/common/v1/metadata.proto";

// AuthService defines the JWT-based authentication contract shared by all
// probopass backend services. It covers account registration, credential
// login, token lifecycle (refresh, validation), and logout.
service AuthService {
  // Register creates a new user account and returns an initial token pair.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register"
      body: "*"
    };
  }

  // Login authenticates a user with email and password and returns a
  // token pair.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  // RefreshToken exchanges a valid refresh token for a new token pair.
  // The presented refresh token is invalidated (rotation).
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/refresh"
      body: "*"
    };
  }

  // ValidateToken verifies an access token and returns its claims.
  // Intended for service-to-service authorization checks.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {
    option (google.api.http) = {
      post: "/v1/auth/validate"
      body: "*"
    };
  }

  // Logout revokes the presented refresh token, ending the session.
  // Access tokens remain valid until they expire.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/v1/auth/logout"
      body: "*"
    };
  }

  // ForgotPassword begins a password reset by emailing a reset link to the
  // address, if an account exists. The response is identical whether or not
  // the address is registered, to avoid account enumeration.
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/forgot-password"
      body: "*"
    };
  }

  // ResetPassword completes a password reset: it verifies the single-use
  // token, sets the new password, and revokes all of the user's sessions.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/v1/auth/reset-password"
      body: "*"
    };
  }
}

// TokenPair is the JWT credential set issued on successful authentication.
message TokenPair {
  // Short-lived JWT presented as a Bearer credential on API calls.
  string access_token = 1;

  // Long-lived opaque or JWT token used to obtain new access tokens.
  string refresh_token = 2;

  // Token type for the Authorization header; always "Bearer".
  string token_type = 3;

  // Lifetime of the access token in seconds from issuance.
  int64 expires_in = 4;

  // Absolute expiry time of the access token.
  google.protobuf.Timestamp access_token_expires_at = 5;
}

// TokenClaims is the validated claim set extracted from an access token.
message TokenClaims {
  // Subject of the token: the unique user identifier.
  string subject = 1;

  // Email address of the authenticated user.
  string email = 2;

  // Roles granted to the user, used for authorization decisions.
  repeated string roles = 3;

  // Time the token was issued.
  google.protobuf.Timestamp issued_at = 4;

  // Time the token expires.
  google.protobuf.Timestamp expires_at = 5;
}

message RegisterRequest {
  // Email address used as the login identifier; must be unique.
  string email = 1;

  // Plaintext password; transported over TLS and hashed by the service.
  string password = 2;

  // Display name of the user.
  string full_name = 3;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 4;
}

message RegisterResponse {
  // Unique identifier of the newly created user.
  string user_id = 1;

  // Initial token pair so the user is signed in immediately.
  TokenPair tokens = 2;
}

message LoginRequest {
  // Email address of the account.
  string email = 1;

  // Plaintext password; transported over TLS and verified by the service.
  string password = 2;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 3;
}

message LoginResponse {
  // Unique identifier of the authenticated user.
  string user_id = 1;

  // Token pair for the new session.
  TokenPair tokens = 2;
}

message RefreshTokenRequest {
  // Refresh token previously issued in a TokenPair.
  string refresh_token = 1;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 2;
}

message RefreshTokenResponse {
  // Replacement token pair; the old refresh token is no longer valid.
  TokenPair tokens = 1;
}

message ValidateTokenRequest {
  // Access token to verify.
  string access_token = 1;
}

message ValidateTokenResponse {
  // Whether the token is authentic, unexpired, and unrevoked.
  bool valid = 1;

  // Unique identifier of the user the token belongs to; set when valid.
  string user_id = 2;

  // Claims decoded from the token; set when valid.
  TokenClaims claims = 3;
}

message LogoutRequest {
  // Refresh token of the session to revoke.
  string refresh_token = 1;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 2;
}

message LogoutResponse {
  // Whether a session was found and revoked.
  bool success = 1;
}

message ForgotPasswordRequest {
  // Email address of the account to recover.
  string email = 1;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 2;
}

message ForgotPasswordResponse {
  // Always true. The response is intentionally uniform so callers cannot
  // tell whether the email address is registered.
  bool success = 1;
}

message ResetPasswordRequest {
  // Single-use reset token delivered in the password reset email.
  string token = 1;

  // New plaintext password; transported over TLS and hashed by the service.
  string new_password = 2;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 3;
}

message ResetPasswordResponse {
  // Whether the password was reset.
  bool success = 1;
}
