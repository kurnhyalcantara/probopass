syntax = "proto3";

package probopass.session.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// SessionService manages authentication sessions: creation (login),
// retrieval, refresh-token rotation, and revocation (logout).
service SessionService {
  // CreateSession starts a new session for a user and issues an
  // access/refresh token pair. Unauthenticated.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions"
      body: "*"
    };
  }

  // GetSession returns a session by id. Requires authentication.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = {get: "/v1/sessions/{session_id}"};
  }

  // RefreshSession rotates a refresh token: the presented token is
  // consumed and a new token pair is issued. Unauthenticated.
  rpc RefreshSession(RefreshSessionRequest) returns (RefreshSessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions/refresh"
      body: "*"
    };
  }

  // RevokeSession invalidates a session (logout). Requires authentication.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (google.api.http) = {delete: "/v1/sessions/{session_id}"};
  }
}

// Session is an authentication session bound to a user and a client.
message Session {
  // Unique identifier of the session.
  string id = 1;

  // Identifier of the user the session belongs to.
  string user_id = 2;

  // User-Agent header of the client that created the session.
  string user_agent = 3;

  // IP address of the client that created the session.
  string ip_address = 4;

  // Time the session (and its refresh token) expires.
  google.protobuf.Timestamp expires_at = 5;

  // Time the session was revoked; unset while the session is active.
  google.protobuf.Timestamp revoked_at = 6;

  // Time the session was created.
  google.protobuf.Timestamp created_at = 7;
}

message CreateSessionRequest {
  // Identifier of the already-authenticated user. The credential check
  // happens before this call (e.g. a credentials feature or an upstream
  // identity provider).
  string user_id = 1;
}

message CreateSessionResponse {
  // The newly created session.
  Session session = 1;

  // Short-lived JWT presented as a Bearer credential on API calls.
  string access_token = 2;

  // Long-lived token used to obtain new access tokens via RefreshSession.
  string refresh_token = 3;
}

message GetSessionRequest {
  // Identifier of the session to fetch.
  string session_id = 1;
}

message GetSessionResponse {
  // The requested session.
  Session session = 1;
}

message RefreshSessionRequest {
  // Refresh token previously issued by CreateSession or RefreshSession.
  string refresh_token = 1;
}

message RefreshSessionResponse {
  // The rotated session.
  Session session = 1;

  // Replacement access token.
  string access_token = 2;

  // Replacement refresh token; the presented one is no longer valid.
  string refresh_token = 3;
}

message RevokeSessionRequest {
  // Identifier of the session to revoke.
  string session_id = 1;
}

message RevokeSessionResponse {}
