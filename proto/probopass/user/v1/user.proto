syntax = "proto3";

package probopass.user.v1;

import "probopass/common/v1/metadata.proto";

// UserService is the system of record for user identity and credentials.
// It is an internal, service-to-service contract (no HTTP gateway bindings):
// the auth service calls it to create accounts, verify passwords, look users
// up, and change passwords. Password hashing and storage are owned entirely
// by this service; plaintext passwords are only ever transported over a
// trusted internal channel and are never persisted.
service UserService {
  // CreateUser provisions a new account. Returns ALREADY_EXISTS if the email
  // is already registered.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);

  // VerifyCredentials checks an email/password pair. Returns the user on
  // success and UNAUTHENTICATED on any failure (unknown email or wrong
  // password are indistinguishable to avoid enumeration).
  rpc VerifyCredentials(VerifyCredentialsRequest) returns (VerifyCredentialsResponse);

  // GetUserByEmail looks up an account by email. Returns NOT_FOUND when the
  // address is not registered.
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse);

  // UpdatePassword sets a new password for a user, hashing and storing it.
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse);
}

// User is the identity record exposed to other services. It never carries
// the password hash.
message User {
  // Unique identifier of the user.
  string id = 1;

  // Email address, the login identifier.
  string email = 2;

  // Display name of the user.
  string full_name = 3;

  // Roles granted to the user, used for authorization decisions.
  repeated string roles = 4;
}

message CreateUserRequest {
  // Email address used as the login identifier; must be unique.
  string email = 1;

  // Plaintext password; hashed by the service before storage.
  string password = 2;

  // Display name of the user.
  string full_name = 3;

  // Optional client and tracing context.
  probopass.common.v1.RequestMetadata metadata = 4;
}

message CreateUserResponse {
  // The newly created user.
  User user = 1;
}

message VerifyCredentialsRequest {
  // Email address of the account.
  string email = 1;

  // Plaintext password to verify.
  string password = 2;
}

message VerifyCredentialsResponse {
  // The authenticated user.
  User user = 1;
}

message GetUserByEmailRequest {
  // Email address to look up.
  string email = 1;
}

message GetUserByEmailResponse {
  // The matching user.
  User user = 1;
}

message UpdatePasswordRequest {
  // Identifier of the user whose password is being changed.
  string user_id = 1;

  // New plaintext password; hashed by the service before storage.
  string new_password = 2;
}

message UpdatePasswordResponse {
  // Whether the password was updated.
  bool success = 1;
}
